# ===============================
# Datasource - H2 (file-based)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/webbazar;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# H2 Webconsole
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA & schema/data init
# ===============================
# Gebruik schema.sql + data.sql; Hibernate wijzigt tabellen NIET automatisch
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# ===============================
# Uploads
# ===============================
webbazar.upload-dir=uploads

# ===============================
# JWT
# ===============================
# JWT secret key
app.jwt.secret=ChangeMe_To_A_Very_Long_Random_Secret_Key_AtLeast_32_Chars
app.jwt.expiration=3600000

# ===============================
# Springdoc (Swagger UI)
# ===============================
# springdoc.api-docs.enabled=true
# springdoc.swagger-ui.enabled=true
# springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Error handling
# ===============================
spring.mvc.problemdetails.enabled=true
spring.web.resources.add-mappings=false
